# The reader, on a schedule, on somebody else's machine.
#
# Every five minutes it takes one reading of the fomo leaderboard, posts it to
# the site, and asks the oracle to open or settle whatever is due. GitHub's
# cron is best-effort and drifts under load — settlement takes a median of the
# three readings nearest a moment, so a skipped tick costs nothing.
name: keeper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r keeper/requirements.txt
      - run: python keeper/read.py
        env:
          SITE: ${{ vars.SITE }}
          KEEPER_SECRET: ${{ secrets.KEEPER_SECRET }}
          PRIVY_REFRESH_TOKEN: ${{ secrets.PRIVY_REFRESH_TOKEN }}
          PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
          PRIVY_CA_ID: ${{ vars.PRIVY_CA_ID }}
